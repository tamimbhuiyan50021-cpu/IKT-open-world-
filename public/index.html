<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VICE CITY 3D - OPEN WORLD</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; }
    #gta-hud {
      position: fixed; top: 14px; right: 16px; text-align: right; z-index: 10;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.85);
    }
    #clock { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #f8fafc; }
    #cash { font-size: 24px; font-weight: 900; color: #4ade80; font-family: monospace; margin: 2px 0; }
    #stars { font-size: 18px; color: #facc15; letter-spacing: 3px; }
    #mode-tag { font-size: 11px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; }
    #minimap-wrap {
      position: fixed; top: 14px; left: 16px; width: 135px; height: 95px;
      border: 2px solid rgba(255,255,255,0.75); border-radius: 6px;
      overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 10;
    }
    #ai-box {
      position: fixed; top: 118px; left: 16px; width: 220px;
      background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(6px);
      border-left: 3px solid #38bdf8; border-radius: 6px; padding: 7px 9px;
      font-size: 11px; z-index: 10;
    }
    #ai-log { color: #e2e8f0; margin-bottom: 5px; line-height: 1.3; max-height: 54px; overflow-y: auto; }
    #ai-row { display: flex; gap: 4px; }
    #ai-input {
      flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 11px; user-select: text;
    }
    #ai-btn {
      background: #0284c7; border: none; color: #fff; padding: 4px 8px;
      border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer;
    }
    #speedo {
      position: fixed; bottom: 95px; right: 20px;
      background: rgba(0,0,0,0.65); border: 2px solid #ef4444;
      width: 68px; height: 68px; border-radius: 50%;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10;
    }
    #speed-val { font-size: 18px; font-weight: 900; }
    #speed-unit { font-size: 9px; color: #94a3b8; }
    #prompt {
      position: fixed; bottom: 115px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); border: 1px solid #facc15;
      padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold;
      display: none; z-index: 20; cursor: pointer;
    }
    #left-pad { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 12px; z-index: 10; }
    #right-pad { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 12px; align-items: flex-end; z-index: 10; }
    .ctrl-btn {
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(4px);
      border: 2px solid rgba(255, 255, 255, 0.45);
      color: #fff; font-size: 20px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .ctrl-btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.94); }
    .pedal-gas { width: 54px; height: 74px; border-radius: 12px; border-color: #4ade80; }
    .pedal-brake { width: 50px; height: 60px; border-radius: 12px; border-color: #f87171; }
    #btn-enter { background: rgba(250, 204, 21, 0.35); border-color: #facc15; font-size: 13px; }
  </style>
</head>
<body>
  <div id="minimap-wrap"><canvas id="minimap" width="135" height="95"></canvas></div>
  <div id="ai-box">
    <div style="color:#38bdf8;font-weight:bold;margin-bottom:2px;">AI SYNDICATE // VIPER</div>
    <div id="ai-log">Welcome to the city. Walk to the red sports car or hit Flamingo Casino.</div>
    <div id="ai-row">
      <input id="ai-input" placeholder="Ask Viper..." />
      <button id="ai-btn">SEND</button>
    </div>
  </div>
  <div id="gta-hud">
    <div id="clock">16:30</div>
    <div id="cash">$00005000</div>
    <div id="stars">☆☆☆☆☆</div>
    <div id="mode-tag">ON FOOT</div>
  </div>
  <div id="speedo"><div id="speed-val">0</div><div id="speed-unit">KMH</div></div>
  <div id="prompt">ACTION</div>
  <div id="left-pad">
    <div class="ctrl-btn" id="left">◀</div>
    <div class="ctrl-btn" id="right">▶</div>
  </div>
  <div id="right-pad">
    <div class="ctrl-btn" id="btn-enter">CAR</div><div class="ctrl-btn" id="btn-fire" style="background:rgba(239,68,68,0.4);border-color:#ef4444;font-size:12px;">FIRE</div>
    <div class="ctrl-btn pedal-brake" id="down">▼</div>
    <div class="ctrl-btn pedal-gas" id="up">▲</div>
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';

    let cash = 5000, wanted = 0, inCar = false, speed = 0, cooldown = 0;
    const cashEl = document.getElementById('cash');
    const starsEl = document.getElementById('stars');
    const modeEl = document.getElementById('mode-tag');
    const speedoEl = document.getElementById('speedo');
    const speedValEl = document.getElementById('speed-val');
    const promptEl = document.getElementById('prompt');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ecae1);
    scene.fog = new THREE.Fog(0xc6dbef, 90, 420);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 700);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdbeafe, 0x78716c, 0.95));
    const sun = new THREE.DirectionalLight(0xfffbeb, 1.8);
    sun.position.set(100, 160, 80);
    sun.castShadow = true;
    scene.add(sun);

    function makeGroundTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3f444c'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(88, 88, 336, 336);
      ctx.fillStyle = '#f8fafc';
      for (let i = 100; i <= 400; i += 28) { ctx.fillRect(i, 62, 14, 22); ctx.fillRect(62, i, 22, 14); }
      ctx.strokeStyle = '#eab308'; ctx.lineWidth = 3; ctx.setLineDash([18, 14]);
      ctx.beginPath(); ctx.moveTo(44, 0); ctx.lineTo(44, 512); ctx.moveTo(0, 44); ctx.lineTo(512, 44); ctx.stroke();
      const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(16, 16);
      return t;
    }

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ map: makeGroundTex(), roughness: 0.85 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    function makeFacade(base, win) {
      const c = document.createElement('canvas'); c.width = 256; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = base; ctx.fillRect(0, 0, 256, 512);
      for (let y = 24; y < 480; y += 44) {
        for (let x = 20; x < 225; x += 46) {
          ctx.fillStyle = '#1e293b'; ctx.fillRect(x - 2, y - 2, 30, 34);
          ctx.fillStyle = win; ctx.fillRect(x, y, 26, 30);
          ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x + 2, y + 2, 10, 26);
        }
      }
      ctx.fillStyle = '#0f172a'; ctx.fillRect(10, 455, 236, 57);
      return new THREE.CanvasTexture(c);
    }

    const facades = [makeFacade('#9a4e3a', '#334155'), makeFacade('#8c857b', '#475569'), makeFacade('#64748b', '#93c5fd')];
    const buildings = [];
    for (let gx = -5; gx <= 5; gx++) {
      for (let gz = -5; gz <= 5; gz++) {
        if (gx === 0 && gz === 0) continue;
        const h = 22 + Math.random() * 58;
        const b = new THREE.Mesh(new THREE.BoxGeometry(25, h, 25), new THREE.MeshStandardMaterial({ map: facades[Math.floor(Math.random() * facades.length)], roughness: 0.65 }));
        const bx = gx * 50 + 18, bz = gz * 50 + 18;
        b.position.set(bx, h / 2, bz); b.castShadow = true; b.receiveShadow = true; scene.add(b);
        buildings.push({ x: bx, z: bz, r: 14.5 });
      }
    }

    const casinoPos = new THREE.Vector3(100, 0.15, 100);
    const heistPos = new THREE.Vector3(-100, 0.15, -100);
    const cRing = new THREE.Mesh(new THREE.RingGeometry(4.5, 6.5, 32), new THREE.MeshBasicMaterial({ color: 0xec4899, side: THREE.DoubleSide }));
    cRing.rotation.x = -Math.PI / 2; cRing.position.copy(casinoPos); scene.add(cRing);
    const hRing = new THREE.Mesh(new THREE.RingGeometry(4.5, 6.5, 32), new THREE.MeshBasicMaterial({ color: 0xeab308, side: THREE.DoubleSide }));
    hRing.rotation.x = -Math.PI / 2; hRing.position.copy(heistPos); scene.add(hRing);

    const player = new THREE.Group();
    const pLegs = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.95, 0.35), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
    pLegs.position.y = 0.48; pLegs.castShadow = true; player.add(pLegs);
    const pJacket = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.85, 0.4), new THREE.MeshStandardMaterial({ color: 0x7c2d12 }));
    pJacket.position.y = 1.35; pJacket.castShadow = true; player.add(pJacket);
    const pHead = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.38, 0.36), new THREE.MeshStandardMaterial({ color: 0xfdba74 }));
    pHead.position.y = 1.98; pHead.castShadow = true; player.add(pHead);
    player.position.set(-3.5, 0, 0); scene.add(player);

    const car = new THREE.Group();
    const cBody = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.68, 4.6), new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.75, roughness: 0.18 }));
    cBody.position.y = 0.62; cBody.castShadow = true; car.add(cBody);
    const cRoof = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.52, 2.2), new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.08 }));
    cRoof.position.set(0, 1.18, -0.15); car.add(cRoof);
    const wGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 16); wGeo.rotateZ(Math.PI / 2);
    const wMat = new THREE.MeshStandardMaterial({ color: 0x18181b });
    [[-1.08, 0.42, 1.45], [1.08, 0.42, 1.45], [-1.08, 0.42, -1.45], [1.08, 0.42, -1.45]].forEach(p => {
      const w = new THREE.Mesh(wGeo, wMat); w.position.set(...p); car.add(w);
    });
    car.position.set(2.5, 0, 2); scene.add(car);

    const copCar = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.1, 4.5), new THREE.MeshStandardMaterial({ color: 0x1e3a8a, metalness: 0.6 }));
    copCar.position.set(45, 0.55, 45); scene.add(copCar);
    const keys = { up: false, down: false, left: false, right: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.up = true;
      if (e.key === 's' || e.key === 'ArrowDown') keys.down = true;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'w' || e.key === 'ArrowUp') keys.up = false;
      if (e.key === 's' || e.key === 'ArrowDown') keys.down = false;
      if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
    });
    ['up', 'down', 'left', 'right'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); keys[id] = true; });
      el.addEventListener('touchend', e => { e.preventDefault(); keys[id] = false; });
      el.addEventListener('mousedown', () => keys[id] = true);
      el.addEventListener('mouseup', () => keys[id] = false);
    });

    document.getElementById('btn-enter').addEventListener('click', () => {
      if (!inCar && player.position.distanceTo(car.position) < 6) {
        inCar = true; player.visible = false;
      } else if (inCar) {
        inCar = false; player.visible = true;
        player.position.set(car.position.x - 2.5, 0, car.position.z);
      }
    });

    promptEl.addEventListener('click', () => {
      if (cooldown > 0) return;
      const pos = inCar ? car.position : player.position;
      if (pos.distanceTo(casinoPos) < 9) {
        cash = Math.random() > 0.45 ? cash + 1500 : Math.max(0, cash - 500);
        promptEl.textContent = "FLAMINGO CASINO SPIN COMPLETE"; cooldown = 120;
      } else if (pos.distanceTo(heistPos) < 9) {
        cash += 2500; wanted = Math.min(5, wanted + 2);
        promptEl.textContent = "VAULT HEIST COMPLETE: +$2,500"; cooldown = 150;
      }
    });

    const mmCtx = document.getElementById('minimap').getContext('2d');
    function drawMap(pos) {
      mmCtx.fillStyle = '#334155'; mmCtx.fillRect(0, 0, 135, 95);
      const s = 0.25, cx = 67.5, cy = 47.5;
      const dot = (x, z, col) => {
        mmCtx.fillStyle = col; mmCtx.beginPath();
        mmCtx.arc(cx + (x - pos.x) * s, cy + (z - pos.z) * s, 4, 0, Math.PI * 2); mmCtx.fill();
      };
      dot(casinoPos.x, casinoPos.z, '#ec4899');
      dot(heistPos.x, heistPos.z, '#eab308');
      dot(copCar.position.x, copCar.position.z, '#3b82f6');
      mmCtx.fillStyle = '#ffffff'; mmCtx.beginPath(); mmCtx.arc(cx, cy, 4, 0, Math.PI * 2); mmCtx.fill();
    }

    document.getElementById('ai-btn').addEventListener('click', async () => {
      const inp = document.getElementById('ai-input');
      const log = document.getElementById('ai-log');
      const msg = inp.value.trim(); if (!msg) return; inp.value = '';
      log.innerHTML = '<i>Decrypting intel...</i>';
      try {
        const r = await fetch('/api/ai-brain', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, cash, wanted })
        });
        const d = await r.json(); log.innerHTML = `<b>VIPER:</b> ${d.reply}`;
      } catch { log.innerHTML = '<b>VIPER:</b> Comms jammed.'; }
    });

    function hitBuilding(nx, nz, rad) {
      return buildings.some(b => Math.abs(nx - b.x) < b.r + rad && Math.abs(nz - b.z) < b.r + rad);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (cooldown > 0) cooldown--;
      const obj = inCar ? car : player;

      if (inCar) {
        if (keys.up) speed = Math.min(speed + 0.045, 1.15);
        else if (keys.down) speed = Math.max(speed - 0.05, -0.5);
        else speed *= 0.96;
        if (Math.abs(speed) > 0.01) {
          const dir = speed >= 0 ? 1 : -1;
          if (keys.left) car.rotation.y += 0.036 * dir;
          if (keys.right) car.rotation.y -= 0.036 * dir;
        }
        const nx = car.position.x + Math.sin(car.rotation.y) * speed;
        const nz = car.position.z + Math.cos(car.rotation.y) * speed;
        if (!hitBuilding(nx, nz, 1.4)) { car.position.x = nx; car.position.z = nz; } else speed = -speed * 0.35;
      } else {
        speed = 0;
        if (keys.left) player.rotation.y += 0.05;
        if (keys.right) player.rotation.y -= 0.05;
        const mv = keys.up ? 0.22 : (keys.down ? -0.14 : 0);
        if (mv !== 0) {
          const nx = player.position.x + Math.sin(player.rotation.y) * mv;
          const nz = player.position.z + Math.cos(player.rotation.y) * mv;
          if (!hitBuilding(nx, nz, 0.5)) { player.position.x = nx; player.position.z = nz; }
        }
      }

      if (wanted > 0) {
        const dx = obj.position.x - copCar.position.x, dz = obj.position.z - copCar.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist > 3.5) { copCar.position.x += (dx / dist) * 0.52; copCar.position.z += (dz / dist) * 0.52; copCar.lookAt(obj.position); }
      }

      if (obj.position.distanceTo(casinoPos) < 9) { promptEl.style.display = 'block'; if (!cooldown) promptEl.textContent = "TAP TO PLAY FLAMINGO CASINO"; }
      else if (obj.position.distanceTo(heistPos) < 9) { promptEl.style.display = 'block'; if (!cooldown) promptEl.textContent = "TAP TO ROB CITY PLAZA VAULT"; }
      else if (!inCar && player.position.distanceTo(car.position) < 6) { promptEl.style.display = 'block'; promptEl.textContent = "TAP 'CAR' BUTTON TO ENTER VEHICLE"; }
      else promptEl.style.display = 'none';

      const off = (inCar ? new THREE.Vector3(0, 4.2, -9.2) : new THREE.Vector3(0, 2.8, -5.2)).applyAxisAngle(new THREE.Vector3(0, 1, 0), obj.rotation.y);
      camera.position.lerp(obj.position.clone().add(off), 0.14);
      camera.lookAt(obj.position.x, obj.position.y + 1.5, obj.position.z);

      cashEl.textContent = '$' + String(cash).padStart(8, '0');
      starsEl.textContent = '★'.repeat(wanted) + '☆'.repeat(5 - wanted);
      modeEl.textContent = inCar ? 'DRIVING' : 'ON FOOT';
      speedoEl.style.display = inCar ? 'flex' : 'none';
      speedValEl.textContent = Math.abs(Math.round(speed * 190));

      drawMap(obj.position);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

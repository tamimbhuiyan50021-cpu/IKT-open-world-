
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Open World City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:15px;left:15px;color:white;
background:#0009;padding:12px;border-radius:10px;z-index:5}
#controls{position:fixed;bottom:25px;left:20px;right:20px;
display:flex;justify-content:space-between;z-index:10}
.pad{display:grid;grid-template-columns:repeat(3,55px);
grid-template-rows:repeat(2,55px);gap:5px}
.btn{background:#222b;color:white;border:1px solid #aaa;
border-radius:12px;font-size:22px;touch-action:none}
#hint{position:fixed;bottom:5px;left:0;right:0;
text-align:center;color:white;font-size:11px}
</style>
</head>
<body>
<div id="hud">
<b>OPEN WORLD CITY</b><br>
<span id="status">Loading...</span>
</div>

<div id="controls">
<div class="pad">
<div></div><button class="btn" data-key="w">▲</button><div></div>
<button class="btn" data-key="a">◀</button>
<button class="btn" data-key="s">▼</button>
<button class="btn" data-key="d">▶</button>
</div>
<button class="btn" id="run" style="width:65px;height:65px">RUN</button>
</div>
<div id="hint">Move: WASD / Touch controls | Drag screen to look around</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,80,260);

const camera = new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,500
);
const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x52634b,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,40);
scene.add(sun);

const mat=(color)=>new THREE.MeshLambertMaterial({color});
const ground= new THREE.Mesh(
new THREE.PlaneGeometry(500,500),mat(0x54864c)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.08;
scene.add(ground);

// Roads
function road(x,z,w,d){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,0.12,d),mat(0x30343a));
m.position.set(x,0,z);scene.add(m);
}
for(let i=-2;i<=2;i++){
road(i*55,0,13,280);
road(0,i*55,280,13);
}

// Road markings
for(let i=-2;i<=2;i++){
for(let j=-12;j<=12;j++){
const line=new THREE.Mesh(
new THREE.BoxGeometry(.25,.14,3),
mat(0xf4e7a0));
line.position.set(i*55,.08,j*11);
scene.add(line);
const line2=new THREE.Mesh(
new THREE.BoxGeometry(3,.14,.25),
mat(0xf4e7a0));
line2.position.set(j*11,.08,i*55);
scene.add(line2);
}
}

// Buildings
const buildingColors=[
0x9cabb4,0xc5a98b,0x858c9b,0xd2c6ae,
0x697f91,0xb4b6b9,0x8d9a82
];
const buildings=[];
for(let x=-125;x<=125;x+=27){
for(let z=-125;z<=125;z+=27){
if(Math.abs(x%55)<17 || Math.abs(z%55)<17)continue;
const h=12+Math.random()*35;
const w=12+Math.random()*7;
const b=new THREE.Mesh(
new THREE.BoxGeometry(w,h,w),
mat(buildingColors[Math.floor(Math.random()*buildingColors.length)])
);
b.position.set(x,h/2,z);
scene.add(b);
buildings.push(b);
}
}

// Trees
for(let i=0;i<100;i++){
const x=(Math.random()-.5)*260;
const z=(Math.random()-.5)*260;
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.5,3,6),mat(0x654321));
trunk.position.set(x,1.5,z);scene.add(trunk);
const leaves=new THREE.Mesh(
new THREE.ConeGeometry(2.5,6,7),mat(0x23733b));
leaves.position.set(x,5,z);scene.add(leaves);
}

// Player
const player=new THREE.Group();
const skin=mat(0xe2ae83);
const shirt=mat(0x1764b2);
const pants=mat(0x242c39);
const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.4,.55),shirt);
body.position.y=1.65;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.35,12,10),skin);
head.position.y=2.55;player.add(head);
const leg1=new THREE.Mesh(new THREE.BoxGeometry(.32,.9,.35),pants);
leg1.position.set(-.23,.48,0);player.add(leg1);
const leg2=leg1.clone();leg2.position.x=.23;player.add(leg2);
const arm1=new THREE.Mesh(new THREE.BoxGeometry(.25,1,.3),shirt);
arm1.position.set(-.65,1.65,0);player.add(arm1);
const arm2=arm1.clone();arm2.position.x=.65;player.add(arm2);
player.position.set(0,0,10);
scene.add(player);

// Controls
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll('[data-key]').forEach(btn=>{
const k=btn.dataset.key;
btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
btn.addEventListener(ev,()=>keys[k]=false));
});
let running=false;
const runButton=document.getElementById('run');
runButton.addEventListener('pointerdown',()=>running=true);
['pointerup','pointerleave','pointercancel'].forEach(ev=>
runButton.addEventListener(ev,()=>running=false));

// Camera drag
let angle=0,dragging=false,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
if(e.clientY>innerHeight*.65)return;
dragging=true;lastX=e.clientX;
});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
if(dragging){angle-=(e.clientX-lastX)*.006;lastX=e.clientX;}
});

const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);
const speed=running?13:7;
let forward=0,side=0;
if(keys.w||keys.arrowup)forward=1;
if(keys.s||keys.arrowdown)forward=-1;
if(keys.a||keys.arrowleft)side=1;
if(keys.d||keys.arrowright)side=-1;

const moving=forward!==0||side!==0;
if(moving){
const direction=angle;
player.position.x+=(
Math.sin(direction)*forward+
Math.cos(direction)*side
)*speed*dt;
player.position.z+=(
-Math.cos(direction)*forward+
Math.sin(direction)*side
)*speed*dt;
player.rotation.y=direction+Math.atan2(side,forward);
}

// World boundary
player.position.x=THREE.MathUtils.clamp(player.position.x,-140,140);
player.position.z=THREE.MathUtils.clamp(player.position.z,-140,140);

// Camera follows player
const distance=9;
const targetX=player.position.x+Math.sin(angle)*distance;
const targetZ=player.position.z+Math.cos(angle)*distance;
camera.position.lerp(
new THREE.Vector3(targetX,6,player.position.z+Math.cos(angle)*distance),
.12
);
camera.lookAt(player.position.x,1.4,player.position.z);

document.getElementById('status').textContent=
'City Explorer | '+(running?'Running':'Walking');

renderer.render(scene,camera);
}
camera.position.set(0,6,20);
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
